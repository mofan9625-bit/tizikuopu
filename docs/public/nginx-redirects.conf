# ==============================================================================
# Nginx 302 Redirect Rules for Affiliate Links
# Compatible with VPS, Baota (宝塔面板), 1Panel, Docker Nginx
# 
# Usage Instructions:
# 1. 宝塔面板 (BT-Panel): 站点设置 -> 伪静态 (URL Rewrite) 或 配置文件 (Conf)
#    添加: include /www/server/nginx/conf/nginx-redirects.conf; 或直接粘贴以下内容
# 2. 原生 Nginx VPS: 在对应站点 server { ... } 块内引入:
#    include /path/to/nginx-redirects.conf;
# ==============================================================================

# 1. 云界线 (YunJieXian) 302 临时重定向
location = /go/yunjiexian {
    return 302 https://lier01.yunjiexianaff.com/#/?code=xPthfI62;
}

