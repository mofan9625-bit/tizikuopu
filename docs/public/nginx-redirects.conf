# 默认回退：无参数的 /go 或 /go/ 访问回退到推荐汇总页，带参数则交给静态 go.html
location = /go {
    if ($arg_id != "") {
        rewrite ^ /go.html last;
    }
    return 302 /recommend/;
}

location = /go/ {
    return 302 /recommend/;
}
